<style>
:root{
  --primary:#1a73e8;--primary-dark:#1557b0;--bg:#f1f5f9;--card:#fff;
  --text:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--success:#16a34a;--sidebar:#0f172a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
h1{font-size:19px}h2{font-size:16px;margin-bottom:14px}h3{font-size:15px;margin-bottom:10px}
.muted{color:var(--muted)}.center{text-align:center}.nowrap{white-space:nowrap}

/* ---------- BUTTON ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border:1px solid transparent;border-radius:9px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-outline{background:#fff;border-color:var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-icon{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}
.btn-icon:hover{background:#eef2ff}.btn-icon.danger:hover{background:#fee2e2}

/* ---------- LOGIN ---------- */
#loginView{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#2563eb 100%);padding:18px}
.login-card{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.login-logo{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,#1a73e8,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px}
.login-title{font-size:22px;text-align:center;font-weight:700;letter-spacing:1px}
.login-sub{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 22px}
.login-hint{margin-top:20px;background:#f8fafc;border:1px dashed var(--border);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--muted);line-height:1.8}
.login-footer{margin-top:18px;text-align:center;font-size:12px;color:rgba(255,255,255,.75)}

/* ---------- FORM ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font:inherit;font-size:13.5px;background:#fff;color:var(--text);transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.13)}
input[readonly]{background:#f8fafc;color:var(--muted)}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-actions{display:flex;gap:10px;margin-top:20px}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:12px}

/* ---------- LAYOUT ---------- */
.app-body{display:flex;min-height:100vh}
.sidebar{width:252px;background:var(--sidebar);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50;transition:left .25s}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1a73e8,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:21px}
.brand b{color:#fff;font-size:16px;display:block;letter-spacing:1px}
.brand small{color:#94a3b8;font-size:10.5px}
#navMenu{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;gap:12px;align-items:center;padding:12px 22px;cursor:pointer;color:#94a3b8;font-size:13.5px;font-weight:500;border-left:3px solid transparent;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.nav-item.active{background:linear-gradient(90deg,rgba(26,115,232,.28),rgba(26,115,232,.05));color:#fff;border-left-color:#3b82f6}
.sidebar-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.user-mini b{color:#e2e8f0;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-mini small{color:#64748b;font-size:11px}
.btn-logout{margin-top:10px;width:100%;background:transparent;border-color:#334155;color:#cbd5e1}
.btn-logout:hover{border-color:var(--danger);color:#fca5a5}
.main{margin-left:252px;flex:1;padding:22px 28px 40px;min-width:0;display:flex;flex-direction:column;min-height:100vh}

/* ---------- HEADER (topbar) & FOOTER ---------- */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.topbar h1{flex:1}
.topbar-brand{display:none;font-weight:700;font-size:14px;color:var(--primary);white-space:nowrap}
.user-chip{display:flex;gap:10px;align-items:center;background:#fff;padding:7px 14px 7px 8px;border-radius:99px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.chip-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1a73e8,#60a5fa);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.chip-txt b{display:block;font-size:12.5px;line-height:1.2}
.chip-txt span{font-size:10.5px;color:var(--muted)}
.menu-btn{display:none}
.app-footer{margin-top:auto;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}

/* ---------- CARD & STAT ---------- */
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(15,23,42,.07);padding:20px 22px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-head h2{margin:0}
.card-narrow{max-width:480px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 4px rgba(15,23,42,.07);border-left:4px solid var(--primary)}
.stat .num{font-size:24px;font-weight:700;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat-ic{font-size:26px}
.stat.green{border-left-color:var(--success)}.stat.purple{border-left-color:#9333ea}.stat.orange{border-left-color:#ea580c}

/* ---------- CHART BAR ---------- */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-lbl{width:70px;font-size:12.5px;font-weight:600;text-align:right}
.bar-track{flex:1;background:#eef2f7;border-radius:99px;height:14px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#1a73e8,#60a5fa);border-radius:99px;min-width:4px}
.bar-val{width:30px;font-size:12px;font-weight:700;color:var(--muted)}
.bar-chart{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar-v{width:100%;max-width:38px;background:linear-gradient(180deg,#60a5fa,#1a73e8);border-radius:6px 6px 2px 2px}
.bar-col span{font-size:10.5px;color:var(--muted)}
.rank-list{list-style:none}
.rank-list li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #f1f5f9;font-size:13px}
.rank-list li b{color:var(--primary)}

/* ---------- FILTER & TABLE ---------- */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-bar select{width:auto;min-width:125px}
.filter-bar input{width:auto}
.flt-grow{flex:1;min-width:200px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;text-align:left;padding:10px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.ss-chip{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;background:#eef2ff;border-radius:6px;margin-right:3px;text-decoration:none}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#dcfce7;color:#15803d}
.badge-red{background:#fee2e2;color:#b91c1c}
.badge-plain{background:#f1f5f9;color:#475569}
.pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:14px;font-size:12.5px;color:var(--muted)}
.pg-num{font-weight:600;margin:0 6px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.loading{text-align:center;padding:30px;color:var(--muted)}

/* ---------- SCREENSHOT SLOT ---------- */
.section-title{margin:18px 0 6px;font-size:14px}
.ss-slot{border:1.5px dashed var(--border);border-radius:12px;padding:13px;text-align:center;background:#fafcff}
.ss-label{font-size:12px;font-weight:600;color:#475569}
.ss-thumb{width:100%;height:92px;object-fit:cover;border-radius:8px;margin:9px 0}
.ss-thumb.ph{display:flex;align-items:center;justify-content:center;font-size:30px;background:#eef2f7;color:#94a3b8}
.ss-status{margin-top:8px;font-size:11.5px;color:var(--muted)}
.ss-status a{color:var(--primary)}

/* ---------- MODAL / TOAST / SPINNER ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-sm{max-width:420px}
#confirmMsg{white-space:pre-line;margin:10px 0 18px}
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s;transition:opacity .3s}
.toast.err{background:var(--danger)}.toast.ok{background:var(--success)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.spinner{width:32px;height:32px;border:3px solid #dbeafe;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.export-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.export-info{margin-top:16px;background:#f0f9ff;border:1px solid #bae6fd;color:#075985;border-radius:10px;padding:12px 16px;font-size:13px}
.switch-link{margin-top:16px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;line-height:1.6}
.switch-link b{color:var(--text);transition:color .15s}
.switch-link:hover b{color:var(--primary)}

/* ---------- RESPONSIVE ---------- */
@media (max-width:920px){
  .sidebar{left:-260px}
  .sidebar.open{left:0;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .main{margin-left:0;padding:16px 14px 30px}
  .menu-btn{display:inline-flex}
  .topbar-brand{display:inline-flex;align-items:center;gap:6px}
  .grid2,.grid3,.grid2col{grid-template-columns:1fr}
  .user-chip .chip-txt{display:none}
  .app-footer{justify-content:center;text-align:center}
}
</style>
