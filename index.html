<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKEDO — Sistem Kehadiran Dosen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0; /* Warna loading background */
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .iframe-container iframe {
            position: absolute;
            top: -3px; /* Trik: Menggeser frame ke atas sebesar 3px (ukuran banner Google) */
            left: 0;
            width: 100%;
            height: calc(100% + 3px); /* Mengkompensasi tinggi yang tergeser */
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- Ganti dengan URL Web App Anda -->
        <iframe src="https://script.google.com/macros/s/AKfycbz4xQ11di6zJQ0Rfvrj45OtDz4hDTiAGwEfHEDyE07KSiGBOaXFbNVfZyUiT7FWLUaD/exec"></iframe>
    </div>
</body>
</html>
